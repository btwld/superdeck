name: superdeck_example
description: An example presentation for SuperDeck
publish_to: none
version: 1.0.0+1
environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.6"

resolution: workspace

dependencies:
  ack: ^1.6.2
  ack_annotations: ^1.6.2
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  mesh: ^0.5.0
  mix: ^2.2.0-beta.0
  naked_ui: ^1.0.0-beta.4
  remix: ^1.0.0-beta.1
  signals_flutter: ^7.1.0
  superdeck: ^1.0.0
  superdeck_core: ^1.0.0
dev_dependencies:
  ack_generator: ^1.6.2
  build_runner: ^2.5.4
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  superdeck_builder: ^1.0.0
  superdeck_cli: ^1.0.0
  superdeck_pdf: ^1.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/
    - .superdeck/
    - layout_showcase/assets/
    - layout_showcase/.superdeck/
