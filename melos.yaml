name: superdeck_workspace

sdkPath: .fvm/flutter_sdk
packages:
  - packages/*
  - demo

command:
  bootstrap:
    environment:
      sdk: ">=3.10.0 <4.0.0"
      flutter: ">=3.38.1"
    dependencies:
      collection: ^1.18.0
      mix: ^2.0.0-rc.0
      ack: 1.0.0-beta.9
  # publish:
    # hooks:
    #   pre: melos run gen:build

scripts:
  # ANALYSIS
  analyze:
    run: fvm flutter pub run melos run analyze:dart && fvm flutter pub run melos run analyze:dcm
    description: Run standard static analysis checks.
      
  analyze:all:
    run: fvm flutter pub run melos run analyze && fvm flutter pub run melos run analyze:dcm:unused-files && fvm flutter pub run melos run analyze:dcm:unused-code
    description: Run all analysis checks including unused files and code.

  analyze:dart:
    run: fvm flutter pub run melos exec -c 10 -- fvm dart analyze --fatal-infos
    description: Run Dart static analysis checks.

  analyze:dcm:
    run: fvm flutter pub run melos exec -c 10 -- dcm analyze . --fatal-style --fatal-warnings
    description: Run DCM static analysis checks.
    packageFilters:
      dependsOn: "dart_code_metrics_presets"

  analyze:dcm:unused-files:
    run: fvm flutter pub run melos exec -c 10 -- dcm check-unused-files . --fatal-unused
    description: Check for unused files using DCM.
    packageFilters:
      dependsOn: "dart_code_metrics_presets"

  analyze:dcm:unused-code:
    run: fvm flutter pub run melos exec -c 10 -- dcm check-unused-code . --fatal-unused
    description: Check for unused code using DCM.
    packageFilters:
      dependsOn: "dart_code_metrics_presets"

  fix:
    run: fvm flutter pub run melos run fix:dart && fvm flutter pub run melos run fix:dcm
    description: Run all static analysis checks and apply fixes.

  fix:dart:
    run: fvm flutter pub run melos exec -- fvm dart fix --apply .
    description: Run Dart static analysis checks.

  fix:dcm:
    run: fvm flutter pub run melos exec -- dcm fix .
    description: Run DCM static analysis checks.
    packageFilters:
      dependsOn: "dart_code_metrics_presets"

  build_runner:watch:
    run: fvm flutter pub run melos exec --order-dependents -- dart run build_runner watch --delete-conflicting-outputs
    description: Generate code for all packages
    packageFilters:
      dependsOn: "build_runner"

  build_runner:build:
    run: fvm flutter pub run melos run build_runner:clean && fvm flutter pub run melos exec --order-dependents -- dart run build_runner build --delete-conflicting-outputs
    description: Generate code for all packages
    packageFilters:
      dependsOn: "build_runner"

  build_runner:clean:
    run: fvm flutter pub run melos exec --order-dependents -- dart run build_runner clean
    description: Clean generated code for all packages
    packageFilters:
      dependsOn: "build_runner"

  contracts:export:
    exec: fvm dart run tool/export_contract_schemas.dart
    description: Export canonical JSON Schema artifacts for SuperDeck contracts.
    packageFilters:
      scope: "superdeck_core"

  contracts:check:
    exec: fvm dart run tool/export_contract_schemas.dart --check
    description: Verify canonical JSON Schema artifacts are up to date.
    packageFilters:
      scope: "superdeck_core"

  test:
    run: fvm flutter pub run melos exec -- fvm flutter test --exclude-tags golden --exclude-tags flaky
    description: Run flutter tests excluding explicit golden and flaky suites.
    packageFilters:
      dirExists: test

  test:integration:
    run: cd demo && fvm dart run superdeck_cli:main build && fvm flutter test integration_test/all_tests.dart -d linux --fail-fast --timeout 2m
    description: Run flutter integration tests on Linux (CI default)

  test:integration:macos:
    run: cd demo && fvm dart run superdeck_cli:main build && fvm flutter test integration_test/all_tests.dart -d macos --fail-fast --timeout 2m
    description: Run flutter integration tests on macOS (local)

  test:e2e:web:prepare:
    run: cd demo && fvm dart run superdeck_cli:main build && fvm flutter build web --release
    description: Build demo assets and release web output for Playwright smoke tests.

  test:e2e:web:
    run: fvm flutter pub run melos run test:e2e:web:prepare && cd demo/e2e && npm ci && npx playwright install --with-deps chromium webkit && npm run test:smoke
    description: Run Playwright smoke tests for the demo web build on Chromium and WebKit.

  test:e2e:
    run: fvm flutter pub run melos run test:integration && fvm flutter pub run melos run test:e2e:web
    description: Run full desktop integration and web smoke E2E coverage.

  test:all:
    run: fvm flutter pub run melos run test && fvm flutter pub run melos run test:integration
    description: Run all tests (unit + integration)

  test:coverage:
    run: fvm flutter pub run melos exec -- fvm flutter test --coverage
    description: Run flutter test with coverage
    packageFilters:
      dirExists: test

  clean:
    run: fvm flutter pub run melos exec -- fvm flutter clean
    description: Clean all packages

  brb:
    run: fvm flutter pub run melos run gen:build:superdeck

  brbc:
    run: fvm flutter pub run melos run gen:clean

  custom_lint_analyze:
    run: fvm dart pub global activate custom_lint && fvm flutter pub run melos exec --depends-on="mix_lint" fvm dart run custom_lint
