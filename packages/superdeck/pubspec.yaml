name: superdeck
description: A Flutter presentation framework that renders slides written in Markdown.
version: 1.0.0
homepage: https://github.com/btwld/superdeck
documentation: https://docs.page/btwld/superdeck

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.6"

resolution: workspace

dependencies:
  cached_network_image: ^4.0.0
  collection: ^1.18.0
  flutter:
    sdk: flutter
  flutter_markdown_plus: ^1.0.5
  go_router: ^18.0.1
  google_fonts: ^8.2.1
  markdown: ^7.3.0
  mermaid_core: 0.3.0
  mermaid_flutter: 0.3.0
  mix: ^2.2.0-beta.0
  mix_annotations: ^2.2.0-beta.0
  path: ^1.9.0
  path_provider: ^2.1.4
  qr_flutter: ^4.1.0
  remix: ^1.0.0-beta.1
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  string_scanner: ^1.4.0
  superdeck_core: ^1.0.0
  web: ^1.1.0
  webview_flutter: ^4.10.0
  webview_flutter_web: ^0.2.3
  window_manager: ^0.5.2

dev_dependencies:
  build_runner: ^2.5.4
  flutter_test:
    sdk: flutter
  mix_generator: 2.2.0-beta.0
  path_provider_platform_interface: ^2.1.2
  superdeck_builder: ^1.0.0
  webview_flutter_platform_interface: ^2.15.1

flutter:
  uses-material-design: true
  assets:
    - assets/grammars/
    - assets/highlight_themes/
