name: superdeck
description: A Flutter presentation framework that renders slides written in Markdown.
version: 1.0.0
homepage: https://github.com/btwld/superdeck
documentation: https://docs.page/btwld/superdeck

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"


dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.4.1
  window_manager: ^0.5.1
  collection: ^1.18.0
  dart_mappable: ^4.7.0
  path: ^1.9.0
  syntax_highlight: ^0.5.0
  scrollable_positioned_list: ^0.3.8
  go_router: ^17.2.3
  path_provider: ^2.1.4
  mix: ^2.0.3
  remix: ^0.2.0
  flutter_markdown_plus: ^1.0.5
  superdeck_core: ^1.0.0
  markdown: ^7.3.0
  web: ^1.1.0
  webview_flutter: ^4.10.0
  google_fonts: ^8.1.0
  qr_flutter: ^4.1.0
  signals: ^7.0.0
  signals_flutter: ^7.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4
  flutter_lints: ^5.0.0
  custom_lint: ^0.8.1
  dart_code_metrics_presets: ^2.19.0
  build_runner: ^2.5.4
  dart_mappable_builder: ^4.7.0
  path_provider_platform_interface: ^2.1.2
  superdeck_builder:
    path: ../builder

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/grammars/
