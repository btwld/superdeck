name: superdeck_cli
description: Command line interface for SuperDeck
version: 2.0.0
homepage: https://github.com/btwld/superdeck
documentation: https://docs.page/btwld/superdeck

executables:
  superdeck: main
environment:
  sdk: ">=3.12.0 <4.0.0"

resolution: workspace

dependencies:
  yaml: ^3.1.3
  args: ^2.6.0
  path: ^1.9.0
  yaml_writer: ^2.0.1
  meta: ^1.16.0
  superdeck_core: ^2.0.0
  superdeck_builder: ^2.0.0
  mason_logger: ^0.3.1

dev_dependencies:
  dart_code_metrics_presets: ^2.19.0
  lints: ^6.1.0
  test: ^1.25.8
