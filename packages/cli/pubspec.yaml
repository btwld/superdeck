name: superdeck_cli
description: Command line interface for SuperDeck
version: 1.0.0
homepage: https://github.com/leoafarias/superdeck

executables:
  superdeck: main
environment:
  sdk: ">=3.9.0 <4.0.0"


dependencies:
  yaml: ^3.1.3
  args: ^2.6.0
  path: ^1.9.0
  yaml_writer: ^2.0.1
  superdeck_core: ^1.0.0
  superdeck_builder: ^1.0.0
  mason_logger: ^0.3.1
  shelf: ^1.4.2
  shelf_static: ^1.1.3
  shelf_web_socket: ^2.0.1

dev_dependencies:
  dart_code_metrics_presets: ^2.19.0
  lints: ^5.0.0
  mocktail: ^1.0.4
  test: ^1.25.8
