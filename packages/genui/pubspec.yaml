name: superdeck_genui
description: AI-powered presentation wizard for SuperDeck using GenUI and Gemini.
version: 1.0.0
publish_to: none
homepage: https://github.com/leoafarias/superdeck

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  mix: ^2.0.0-rc.0
  remix: ^0.1.0-beta.2
  genui: ^0.6.1
  genui_google_generative_ai: ^0.6.1
  json_schema_builder: ^0.1.3
  signals: ^6.2.0
  signals_flutter: ^6.2.0
  gpt_markdown: ^1.1.4
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  superdeck: ^1.0.0
  superdeck_core: ^1.0.0
  flutter_dotenv: ^6.0.0
  google_cloud_ai_generativelanguage_v1beta: ^0.3.0
  path: ^1.9.0
  path_provider: ^2.1.0
  dotprompt_dart: ^0.5.0
  ack: ^1.0.0-beta.7
  ack_annotations: ^1.0.0-beta.7
  ack_json_schema_builder:
    git:
      url: https://github.com/btwld/ack
      path: packages/ack_json_schema_builder
      ref: main

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  dart_code_metrics_presets: ^2.19.0
  ack_generator: ^1.0.0-beta.7
  build_runner: ^2.4.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/prompts/
    - assets/prompts/partials/
    - assets/examples/
