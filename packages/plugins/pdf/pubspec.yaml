name: superdeck_pdf
description: PDF export support for SuperDeck presentations.
version: 1.0.0
homepage: https://github.com/btwld/superdeck
documentation: https://docs.page/btwld/superdeck

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.0"

dependencies:
  flutter:
    sdk: flutter
  file_saver: ^0.4.0
  pdf: ^3.11.1
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  superdeck: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics_presets: ^2.19.0
  google_fonts: ^8.1.0
  superdeck_core: ^1.0.0

flutter:
  uses-material-design: true
