name: superdeck_pdf
description: PDF export support for SuperDeck presentations.
version: 1.0.0
homepage: https://github.com/btwld/superdeck
documentation: https://docs.page/btwld/superdeck

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.38.1"

dependencies:
  flutter:
    sdk: flutter
  file_saver: ^0.2.14
  pdf: ^3.11.1
  signals: ^6.2.0
  signals_flutter: ^6.2.0
  superdeck: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  dart_code_metrics_presets: ^2.19.0
  google_fonts: ^6.3.2
  superdeck_core: ^1.0.0

flutter:
  uses-material-design: true
