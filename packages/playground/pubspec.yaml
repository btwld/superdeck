name: playground
description: >-
  The SuperDeck Wizard: generate a deck with AI, present it, and save it to
  disk with its artwork and theme.
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.6"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # State management & DI.
  provider: ^6.1.2
  go_router: ^18.0.1
  # signals: the Wizard conversation view model's reactive state.
  # signals_flutter: main.dart turns off signals' debug logging.
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  # UI
  mix: ^2.2.0-beta.0
  remix: ^1.0.0-beta.1
  google_fonts: ^8.2.1
  lucide_icons_flutter: ^3.1.20
  hero_ui:
    git:
      url: https://github.com/leoafarias/hero_ui
      ref: 21a279c8d15dd5ad641ee0d963940095e7e40a76
  # SuperDeck packages
  superdeck: ^1.0.0
  superdeck_core: ^1.0.0
  superdeck_builder: ^1.0.0
  # AI generation
  genui: ^0.9.2
  googleai_dart: ^9.0.0
  google_cloud_ai_generativelanguage_v1beta: ^0.5.2
  dotprompt_dart: ^0.5.0
  path: ^1.9.0
  ack: ^1.6.2
  ack_annotations: ^1.6.2
  ack_json_schema_builder: ^1.6.2
  dartantic_ai: ^3.1.0
  json_schema_builder: ^0.1.5
  # Deck export: a zip written through the platform save dialog.
  archive: ^4.0.9
  file_saver: ^0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics_presets: ^2.33.0
  build_runner: ^2.5.4
  ack_generator: ^1.6.2
  http: ^1.5.0
  image: ^4.10.1

flutter:
  uses-material-design: true
  assets:
    - assets/ai_examples/
    - assets/ai_prompts/
