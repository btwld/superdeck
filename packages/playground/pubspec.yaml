name: playground
description: A playground app for experimenting with Mix, Remix, and Hero UI.
publish_to: none

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  mix: ^2.1.0
  remix: ^0.2.0
  super_editor: 0.3.0-dev.52
  provider: ^6.1.2
  signals: ^6.2.0
  signals_flutter: ^6.2.0
  google_fonts: ^8.1.0
  superdeck:
    path: ../superdeck
  superdeck_core:
    path: ../core
  superdeck_builder:
    path: ../builder
  hero_ui:
    git:
      url: https://github.com/tilucasoli/hero_ui
      ref: v0.0.5
  # AI generation (migrated from superdeck_ai)
  genui: ^0.9.2
  googleai_dart: ^8.0.0
  google_cloud_ai_generativelanguage_v1beta: ^0.4.0
  http: ^1.5.0
  gpt_markdown: ^1.1.4
  dotprompt_dart: ^0.5.0
  flutter_dotenv: ^6.0.0
  path: ^1.9.0
  ack: 1.0.0-beta.12
  ack_annotations: 1.0.0-beta.12
  ack_json_schema_builder: 1.0.0-beta.12
  dartantic_ai: ^3.1.0
  json_schema_builder: ^0.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.5.4
  ack_generator: 1.0.0-beta.12

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/ai_prompts/
    - assets/ai_prompts/partials/
    - assets/ai_examples/
