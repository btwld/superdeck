name: playground
description: A playground app for experimenting with Mix, Remix, and Hero UI.
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.6"

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  # State management & DI — Provider + Command pattern.
  provider: ^6.1.2
  go_router: ^17.3.0
  # signals: core/ bridge stores translate DeckController signals into
  # ChangeNotifier; signals_flutter lets the UI watch DeckController.slides
  # directly, so slides need no bridge store.
  signals: ^7.1.0
  signals_flutter: ^7.1.0
  # UI
  mix: ^2.2.0-beta.0
  remix: ^1.0.0-beta.1
  super_editor: 0.3.0-dev.52
  google_fonts: ^8.1.0
  lucide_icons_flutter: ^3.1.15
  hero_ui:
    git:
      url: https://github.com/leoafarias/hero_ui
      ref: 21a279c8d15dd5ad641ee0d963940095e7e40a76
  # SuperDeck packages
  superdeck: ^1.0.0
  superdeck_core: ^1.0.0
  superdeck_builder: ^1.0.0
  # AI generation
  genui: ^0.9.2
  googleai_dart: ^9.0.0
  google_cloud_ai_generativelanguage_v1beta: ^0.5.2
  http: ^1.5.0
  gpt_markdown: ^1.1.4
  dotprompt_dart: ^0.5.0
  path: ^1.9.0
  ack: ^1.2.0
  ack_annotations: ^1.2.0
  ack_json_schema_builder: ^1.2.0
  dartantic_ai: ^3.1.0
  json_schema_builder: ^0.1.5
  # Filesystem persistence for the playground editor (desktop-only).
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  dart_code_metrics_presets: ^2.19.0
  build_runner: ^2.5.4
  ack_generator: ^1.2.0
  # Test-only: mock path_provider so the native deck file store can be exercised
  # against a temp directory.
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8
  golden_toolkit: ^0.15.0
  image: ^4.8.0

flutter:
  uses-material-design: true
  assets:
    - assets/ai_examples/
    - assets/ai_prompts/
