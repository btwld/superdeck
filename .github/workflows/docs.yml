name: Documentation

on:
  push:
    branches: ["main"]
    paths:
      - "docs/**"
      - "docs.json"
      - ".github/workflows/docs.yml"
  # Draft pull requests skip every job. ready_for_review runs CI when the PR is marked ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: ["main"]
    paths:
      - "docs/**"
      - "docs.json"
      - ".github/workflows/docs.yml"

concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    # `draft` is null on push, so non-pull_request runs are unchanged.
    if: ${{ github.event.pull_request.draft != true }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install docs.page CLI
        run: npm install -g @docs.page/cli

      - name: Validate documentation
        run: npx @docs.page/cli check
