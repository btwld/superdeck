# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on PR

on:
  pull_request:
    paths:
      - "demo/**"
      - "packages/**"
      - "melos.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"

permissions:
  checks: write
  contents: read
  pull-requests: write

jobs:
  build_and_preview:
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        shell: bash
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "/home/runner/fvm/bin" >> $GITHUB_PATH
          export PATH="/home/runner/fvm/bin:$PATH"
          fvm use --force

      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: ${{ steps.fvm-config-action.outputs.FLUTTER_CHANNEL }}

      - name: Align Melos SDK path
        run: |
          mkdir -p .fvm
          ln -sfn "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3

      - name: Build Runner
        run: melos run build_runner:build

      - name: Build SuperDeck assets
        run: |
          cd demo
          fvm dart run superdeck_cli:main build

      - name: Deploy Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        with:
          entryPoint: ./demo
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPERDECK_DEV }}
          expires: 30d
          projectId: superdeck-dev
