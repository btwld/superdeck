# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - "packages/**"
      - ".fvmrc"
      - "pubspec.yaml"
      - "pubspec.lock"

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        shell: bash
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "/home/runner/fvm/bin" >> $GITHUB_PATH

      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: stable

      - name: Align Melos SDK path
        run: |
          mkdir -p .fvm
          ln -sfn "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3
        with:
          melos-version: 7.8.1

      - name: Install dependencies
        run: fvm flutter pub get

      - name: Build Runner
        run: melos run build_runner:build --no-select

      - name: Build SuperDeck assets
        run: |
          cd demo
          fvm dart run superdeck_cli:main build

      # Pin Node to avoid the keep-alive socket regression in Node 22.23.0 /
      # 24.17.0 (nodejs/node#63989), which makes firebase-tools fail channel
      # deploys with "premature close" -> retried release -> FAILED_PRECONDITION.
      - name: Pin Node for Firebase deploy
        uses: actions/setup-node@v4
        with:
          node-version: "24.18.0"

      - name: Deploy Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        with:
          entryPoint: ./demo
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPERDECK_DEV }}
          firebaseToolsVersion: "15.22.3"
          channelId: live
          projectId: superdeck-dev
