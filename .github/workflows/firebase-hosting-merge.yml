# This file was auto-generated by the Firebase CLI
# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on Merge

on:
  push:
    branches:
      - main
    paths:
      - "demo/**"
      - "packages/**"
      - "melos.yaml"
      - "pubspec.yaml"
      - "pubspec.lock"

jobs:
  test:
    name: Test
    uses: ./.github/workflows/test.yml

  build_and_deploy:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Install FVM
        shell: bash
        run: |
          curl -fsSL https://fvm.app/install.sh | bash
          echo "/home/runner/fvm/bin" >> $GITHUB_PATH

      - uses: kuhnroyal/flutter-fvm-config-action@v2
        id: fvm-config-action

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ steps.fvm-config-action.outputs.FLUTTER_VERSION }}
          channel: stable

      - name: Align Melos SDK path
        run: |
          mkdir -p .fvm
          ln -sfn "$FLUTTER_ROOT" .fvm/flutter_sdk

      - name: Setup Melos
        uses: bluefireteam/melos-action@v3

      - name: Build Runner
        run: melos run build_runner:build

      - name: Build SuperDeck assets
        run: |
          cd demo
          fvm dart run superdeck_cli:main build

      # Firebase deployment is owned by the `superdeck_deploy` package
      # (`superdeck-deploy firebase`) for local/manual deploys. CI keeps the
      # GitHub-integrated action below for live deploys + PR preview comments.
      - name: Deploy Firebase
        uses: FirebaseExtended/action-hosting-deploy@v0
        env:
          FIREBASE_CLI_EXPERIMENTS: webframeworks
        with:
          entryPoint: ./demo
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_SUPERDECK_DEV }}
          channelId: live
          projectId: superdeck-dev
