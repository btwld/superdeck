name: superdeck_workspace
publish_to: none

environment:
  sdk: ">=3.12.0 <4.0.0"
  flutter: ">=3.44.6"

workspace:
  - demo
  - packages/*
  - packages/plugins/*

dev_dependencies:
  bitwild_analysis:
    git:
      url: https://github.com/btwld/lints.git
      path: packages/bitwild_analysis
      ref: v0.3.0
  # Keep in sync with `melos-version` in .github/workflows/*.yml.
  melos: 8.9.0

dependency_overrides:
  # Hero UI's Remix 1.0 migration commit still points at development Git
  # branches. Resolve its runtime dependencies to the published betas used by
  # this workspace until that upstream migration is released.
  mix_annotations: 2.2.0-beta.0
  # Remix beta.1 uses positioning and slider APIs removed in naked_ui 1.0.1.
  naked_ui: 1.0.0-beta.4
  remix: 1.0.0-beta.1

melos:
  sdkPath: .fvm/flutter_sdk
  ide:
    intellij:
      enabled: false

  scripts:
    # ANALYSIS
    analyze:
      # One package at a time: parallel analysis servers race to build the
      # shared bitwild_lints plugin snapshot.
      run: fvm dart run melos exec -c 1 -- fvm dart analyze --fatal-infos
      description: >-
        Run static analysis checks, including the bitwild_lints analyzer
        plugin.

    analyze:dart:
      run: fvm dart run melos run analyze
      description: Alias for analyze.

    fix:
      run: fvm dart run melos exec -- fvm dart fix --apply .
      description: Apply dart fix. Plugin quick fixes are applied from the IDE.

    build_runner:watch:
      run: fvm dart run melos exec --order-dependents -- fvm dart run build_runner watch
      description: Generate code for all packages
      packageFilters:
        dependsOn: build_runner

    build_runner:build:
      run: fvm dart run melos run build_runner:clean && fvm dart run melos exec --order-dependents -- fvm dart run build_runner build
      description: Generate code for all packages
      packageFilters:
        dependsOn: build_runner

    build_runner:clean:
      run: fvm dart run melos exec --order-dependents -- fvm dart run build_runner clean
      description: Clean generated code for all packages
      packageFilters:
        dependsOn: build_runner

    contracts:export:
      exec: fvm dart run tool/export_contract_schemas.dart
      description: Export canonical JSON Schema artifacts for SuperDeck contracts.
      packageFilters:
        scope: superdeck_core

    contracts:check:
      exec: fvm dart run tool/export_contract_schemas.dart --check
      description: Verify canonical JSON Schema artifacts are up to date.
      packageFilters:
        scope: superdeck_core

    test:
      run: fvm dart run melos exec -c 1 -- fvm flutter test --exclude-tags ci-excluded
      description: >-
        Run the package unit and widget tests. Excludes `ci-excluded` suites,
        desktop integration tests, browser smoke tests, and live generation
        tests.
      packageFilters:
        dirExists: test

    test:integration:
      run: cd demo && fvm dart run superdeck_cli:main build && fvm flutter test integration_test/all_tests.dart -d linux --fail-fast --timeout 2m
      description: >-
        Run the demo desktop integration tests on Linux, which is the CI
        default device.

    test:integration:macos:
      run: cd demo && fvm dart run superdeck_cli:main build && fvm flutter test integration_test/all_tests.dart -d macos --fail-fast --timeout 2m
      description: >-
        Run the demo desktop integration tests on macOS, which is the local
        default device.

    test:e2e:web:prepare:
      run: cd demo && fvm dart run superdeck_cli:main build && fvm flutter build web --release
      description: Build demo assets and release web output for Playwright smoke tests.

    test:e2e:web:
      run: fvm dart run melos run test:e2e:web:prepare && cd demo/e2e && npm ci && npx playwright install --with-deps chromium webkit && npm run test:smoke
      description: >-
        Run the browser smoke tests for the demo web build on Chromium and
        WebKit.

    test:e2e:
      run: fvm dart run melos run test:integration && fvm dart run melos run test:e2e:web
      description: Run the desktop integration tests and the browser smoke tests.

    test:all:
      run: fvm dart run melos run test && fvm dart run melos run test:integration
      description: >-
        Run the package tests and the Linux desktop integration tests. Does not
        run the browser smoke tests or the live generation tests.

    test:coverage:
      run: fvm dart run melos exec -- fvm flutter test --coverage
      description: Run flutter test with coverage
      packageFilters:
        dirExists: test

    clean:
      run: fvm dart run melos exec -- fvm flutter clean
      description: Clean all packages

    brb:
      run: fvm dart run melos run build_runner:build
      description: Short alias for `build_runner:build`.

    brbc:
      run: fvm dart run melos run build_runner:clean
      description: Short alias for `build_runner:clean`.
